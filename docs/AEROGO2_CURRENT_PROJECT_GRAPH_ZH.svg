<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1900" viewBox="0 0 2200 1900" role="img" aria-labelledby="title desc">
  <title id="title">AeroGo2 当前工程节点与控制流图</title>
  <desc id="desc">按当前源代码绘制的系统运行时、主状态机、Go2 LowCmd 控制权、多速率 Impact-aware 着陆和安全故障路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
    <style>
      .bg{fill:#0f172a}.panel{fill:#111c30;stroke:#334155;stroke-width:2}.panel-title{fill:#e2e8f0;font:bold 23px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.node{fill:#1e293b;stroke:#64748b;stroke-width:1.6}.bridge{fill:#172554;stroke:#3b82f6}.core{fill:#312e81;stroke:#818cf8;stroke-width:2.4}.ok{fill:#14532d;stroke:#4ade80}.landing{fill:#713f12;stroke:#f59e0b}.landing2{fill:#7c2d12;stroke:#fb923c}.bad{fill:#7f1d1d;stroke:#f87171;stroke-width:2.2}.info{fill:#164e63;stroke:#22d3ee}.note{fill:#27272a;stroke:#71717a}.t{fill:#f8fafc;font:16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;text-anchor:middle}.s{fill:#cbd5e1;font:13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;text-anchor:middle}.edge{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}.thin{fill:none;stroke:#64748b;stroke-width:1.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#f87171;stroke-width:2;stroke-dasharray:9 7;marker-end:url(#arrowRed)}.dot{fill:none;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:2 7;marker-end:url(#arrow)}.elabel{fill:#cbd5e1;font:12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;text-anchor:middle}.warn{fill:#fdba74;font:bold 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;text-anchor:middle}.legend{fill:#cbd5e1;font:14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}
    </style>
  </defs>
  <rect class="bg" width="2200" height="1900"/>
  <text x="1100" y="40" class="panel-title" text-anchor="middle">AeroGo2 当前工程：状态机、控制权与 Impact-aware 多速率控制流</text>
  <text x="1100" y="66" class="s">依据当前源代码绘制；红色虚线表示硬件门禁或尚未接通的链路</text>

  <!-- A. runtime -->
  <rect class="panel" x="30" y="88" width="2140" height="300" rx="18"/>
  <text x="55" y="120" class="panel-title">A. 运行时与外部设备</text>
  <g>
    <rect class="node" x="70" y="150" width="190" height="70" rx="12"/><text class="t" x="165" y="180">操作员 / CLI</text><text class="s" x="165" y="204">确认、接管、急停</text>
    <rect class="node" x="70" y="270" width="190" height="70" rx="12"/><text class="t" x="165" y="300">RadioMaster / RC</text><text class="s" x="165" y="324">CH5 / CH9 / CH10</text>
    <rect class="node" x="330" y="150" width="220" height="80" rx="12"/><text class="t" x="440" y="180">Pixhawk 6X</text><text class="s" x="440" y="204">姿态、速度、landed、ESC</text><text class="s" x="440" y="221">飞控原生基线环</text>
    <rect class="node" x="330" y="270" width="220" height="70" rx="12"/><text class="t" x="440" y="300">F446 折展控制器</text><text class="s" x="440" y="324">着陆阶段保持停止</text>
    <rect class="node" x="620" y="190" width="220" height="100" rx="12"/><text class="t" x="730" y="222">Go2 EDU</text><text class="s" x="730" y="247">SportModeState</text><text class="s" x="730" y="268">LowState / 12 关节</text>

    <rect class="bridge" x="930" y="140" width="250" height="80" rx="12"/><text class="t" x="1055" y="172">MavlinkPixhawkBridge</text><text class="s" x="1055" y="198">遥测、受限命令</text>
    <rect class="bridge" x="930" y="245" width="250" height="60" rx="12"/><text class="t" x="1055" y="281">TextF446Bridge</text>
    <rect class="bridge" x="1240" y="130" width="250" height="75" rx="12"/><text class="t" x="1365" y="160">UnitreeGo2Bridge</text><text class="s" x="1365" y="185">高层 SportClient</text>
    <rect class="bridge" x="1240" y="225" width="250" height="105" rx="12"/><text class="t" x="1365" y="255">LowLevelSdkBridge</text><text class="s" x="1365" y="279">rt/lowstate + 唯一写线程</text><text class="s" x="1365" y="302">CRC、限幅、TTL、watchdog</text>
    <rect class="bridge" x="930" y="325" width="250" height="45" rx="12"/><text class="t" x="1055" y="354">RCMonitor</text>
    <rect class="core" x="1640" y="185" width="270" height="95" rx="14"/><text class="t" x="1775" y="220">SystemManager</text><text class="s" x="1775" y="246">唯一业务编排入口</text><text class="s" x="1775" y="265">StateMachine + Guards</text>
    <rect class="bad" x="1960" y="185" width="170" height="95" rx="14"/><text class="t" x="2045" y="220">SafetyMonitor</text><text class="s" x="2045" y="246">独立安全监测</text><text class="s" x="2045" y="265">违规→FAULT</text>

    <path class="edge" d="M260 185 H1640"/><path class="edge" d="M260 305 H930"/>
    <path class="edge" d="M550 185 H930"/><path class="edge" d="M550 305 H930"/>
