f446:
  flight_direction: "forward"
  walk_direction: "reverse"

  flight_duty: 120
  walk_duty: 300

  expected_flight_state: "LIMIT_REACHED_FWD"
  expected_walk_state: "LIMIT_REACHED_REV"

  response_timeout_s: 0.5
  transform_timeout_s: 15.0
  status_poll_hz: 10

  # F446 local limit-stop parameters. A threshold of 0 preserves the value
  # already calibrated on the board; set a nonzero safe value to reapply it
  # automatically whenever a hardware-write process connects.
  firmware_timeout_ms: 15000
  automatic_stall_threshold_adc: 0
  stall_blanking_ms: 500
  stall_overcurrent_ms: 180

  current_safe_margin_adc: 200
  current_clear_hold_s: 1.0
