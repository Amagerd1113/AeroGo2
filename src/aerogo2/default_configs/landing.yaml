landing:
  controller_hz: 30
  maximum_descent_speed_mps: 0.5
  maximum_horizontal_speed_mps: 0.5
  maximum_yaw_rate_rad_s: 0.5
  controller_timeout_s: 0.1
  manual_override_deadband_us: 150
  default_abort_mode: "LOITER"
  # Smoothly ramps the active velocity setpoint to zero before RC handoff.
  takeover_blend_s: 0.3
  # Window for force impulse integration and average-force reporting.
  impact_force_window_s: 0.05
  # Makes guarded Impact-Aware/MPC recovery selectable in DRY-RUN.
  # Each flight still requires: autoland prepare mpc + CONFIRM_MPC_AUTOLAND.
  # Real hardware output remains blocked until the production control chain is commissioned.
  mpc_enabled: false
